name: TT Booking integration tests

on:
  push:
    branches: [main, "feat/ttbooking-*"]
    paths:
      - "integrations/apps.py"
      - "integrations/adapters.py"
      - "services/job_handlers.py"
      - "services/revalidation.py"
      - "booking/preflight.py"
      - "booking/job_handlers.py"
      - "booking/views.py"
      - "services/views.py"
      - "services/urls.py"
      - "pyproject.toml"
      - "uv.lock"
      - "suppliers/views.py"
      - "integrations/ttbooking.py"
      - "integrations/tests/test_ttbooking.py"
      - "suppliers/job_handlers.py"
      - ".github/workflows/ttbooking-tests.yml"
  pull_request:
    paths:
      - "integrations/apps.py"
      - "integrations/adapters.py"
      - "services/job_handlers.py"
      - "services/revalidation.py"
      - "booking/preflight.py"
      - "booking/job_handlers.py"
      - "booking/views.py"
      - "services/views.py"
      - "services/urls.py"
      - "pyproject.toml"
      - "uv.lock"
      - "suppliers/views.py"
      - "integrations/ttbooking.py"
      - "integrations/tests/test_ttbooking.py"
      - "suppliers/job_handlers.py"
      - ".github/workflows/ttbooking-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: travelhub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d travelhub_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/travelhub_test
      DJANGO_SECRET_KEY: ci-secret-key-for-tests-only
      FIELD_ENCRYPTION_KEY: 3jJ0deI6M0y5d3G7Zbb8xxL4wXO2ldeYmyIQXjmdKF0=

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv
      - name: Install dependencies
        run: uv sync --dev
      - name: Run TT Booking tests
        run: uv run pytest integrations/tests services/tests suppliers/tests booking/tests -v
      - name: Django checks
        run: |
          uv run python manage.py check --settings=config.settings.test
          uv run python manage.py makemigrations --check --dry-run --settings=config.settings.test
