name: Receipt recognition quality

on:
  push:
    branches: [main]
    paths:
      - "documents/receipt_recognition_engine.py"
      - "documents/receipt_ocr_fallback.py"
      - "documents/receipt_rzd_fastpath.py"
      - "documents/receipt_quality_guard.py"
      - "documents/receipt_preflight_patch.py"
      - "documents/receipt_problem_formats_patch.py"
      - "documents/receipt_multiform_patch.py"
      - "documents/receipt_parser_patch_safe.py"
      - "documents/receipt_metadata.py"
      - "documents/apps.py"
      - "documents/tests/test_receipt_*.py"
      - ".github/workflows/receipt-recognition-quality.yml"
  pull_request:
    paths:
      - "documents/receipt_recognition_engine.py"
      - "documents/receipt_ocr_fallback.py"
      - "documents/receipt_rzd_fastpath.py"
      - "documents/receipt_quality_guard.py"
      - "documents/receipt_preflight_patch.py"
      - "documents/receipt_problem_formats_patch.py"
      - "documents/receipt_multiform_patch.py"
      - "documents/receipt_parser_patch_safe.py"
      - "documents/receipt_metadata.py"
      - "documents/apps.py"
      - "documents/tests/test_receipt_*.py"

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: travelhub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d travelhub_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/travelhub_test
      DJANGO_SECRET_KEY: ci-secret-key-for-tests-only
      FIELD_ENCRYPTION_KEY: 3jJ0deI6M0y5d3G7Zbb8xxL4wXO2ldeYmyIQXjmdKF0=

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv
      - name: Install dependencies
        run: uv sync --dev
      - name: Run full receipt recognition regression suite
        run: >-
          uv run pytest
          documents/tests/test_receipt_recognition_engine.py
          documents/tests/test_receipt_rzd_fastpath.py
          documents/tests/test_receipt_multiform_patch.py
          documents/tests/test_receipt_problem_formats.py
          documents/tests/test_receipt_preflight_patch.py
          documents/tests/test_receipt_quality_guard.py
          documents/tests/test_receipt_reprocessing.py
          documents/tests/test_receipt_metadata.py
          documents/tests/test_receipt_avia_brand_patch.py
          documents/tests/test_receipt_hotel_booking_guard.py
          documents/tests/test_receipt_tax_columns.py
