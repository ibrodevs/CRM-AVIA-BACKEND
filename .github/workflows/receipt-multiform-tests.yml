name: Receipt regression tests

on:
  push:
    branches: [main]
    paths:
      - "documents/receipt_multiform_patch.py"
      - "documents/receipt_hotel_booking_guard.py"
      - "documents/receipt_parser_patch_safe.py"
      - "documents/receipt_problem_formats_patch.py"
      - "documents/receipt_preflight_patch.py"
      - "documents/receipt_quality_guard.py"
      - "documents/receipt_metadata.py"
      - "documents/receipt_ticket_level_patch.py"
      - "documents/receipt_sequential_review_patch.py"
      - "documents/receipt_supplier_pdf_patch.py"
      - "documents/receipt_supplier_pdf_font_codec.py"
      - "documents/receipt_supplier_pdf_writer_fix.py"
      - "documents/models.py"
      - "documents/migrations/0007_receiptdraft_receipt_items.py"
      - "documents/apps.py"
      - "documents/urls.py"
      - "documents/tests/test_receipt_multiform_patch.py"
      - "documents/tests/test_receipt_hotel_booking_guard.py"
      - "documents/tests/test_receipt_problem_formats.py"
      - "documents/tests/test_receipt_preflight_patch.py"
      - "documents/tests/test_receipt_quality_guard.py"
      - "documents/tests/test_receipt_ticket_level_patch.py"
      - "documents/tests/test_receipt_sequential_review.py"
      - "documents/tests/test_receipt_supplier_pdf_patch.py"
      - ".github/workflows/receipt-multiform-tests.yml"
  pull_request:
    paths:
      - "documents/receipt_multiform_patch.py"
      - "documents/receipt_hotel_booking_guard.py"
      - "documents/receipt_parser_patch_safe.py"
      - "documents/receipt_problem_formats_patch.py"
      - "documents/receipt_preflight_patch.py"
      - "documents/receipt_quality_guard.py"
      - "documents/receipt_metadata.py"
      - "documents/receipt_ticket_level_patch.py"
      - "documents/receipt_sequential_review_patch.py"
      - "documents/receipt_supplier_pdf_patch.py"
      - "documents/receipt_supplier_pdf_font_codec.py"
      - "documents/receipt_supplier_pdf_writer_fix.py"
      - "documents/models.py"
      - "documents/migrations/0007_receiptdraft_receipt_items.py"
      - "documents/apps.py"
      - "documents/urls.py"
      - "documents/tests/test_receipt_multiform_patch.py"
      - "documents/tests/test_receipt_hotel_booking_guard.py"
      - "documents/tests/test_receipt_problem_formats.py"
      - "documents/tests/test_receipt_preflight_patch.py"
      - "documents/tests/test_receipt_quality_guard.py"
      - "documents/tests/test_receipt_ticket_level_patch.py"
      - "documents/tests/test_receipt_sequential_review.py"
      - "documents/tests/test_receipt_supplier_pdf_patch.py"
      - ".github/workflows/receipt-multiform-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: travelhub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d travelhub_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/travelhub_test
      DJANGO_SECRET_KEY: ci-secret-key-for-tests-only
      FIELD_ENCRYPTION_KEY: 3jJ0deI6M0y5d3G7Zbb8xxL4wXO2ldeYmyIQXjmdKF0=

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv
      - name: Install dependencies
        run: uv sync --dev
      - name: Check migrations
        run: uv run python manage.py makemigrations --check --dry-run
      - name: Run existing receipt regression tests
        run: >-
          uv run pytest
          documents/tests/test_receipt_multiform_patch.py
          documents/tests/test_receipt_hotel_booking_guard.py
          documents/tests/test_receipt_problem_formats.py
          documents/tests/test_receipt_preflight_patch.py
          documents/tests/test_receipt_quality_guard.py
          documents/tests/test_receipt_ticket_level_patch.py
          documents/tests/test_receipt_sequential_review.py
      - name: Supplier PDF formatting and group targeting
        run: >-
          uv run pytest documents/tests/test_receipt_supplier_pdf_patch.py
          -k "amount_format or group_ticket" -vv
      - name: Supplier PDF same-font replacement
        run: >-
          uv run pytest documents/tests/test_receipt_supplier_pdf_patch.py
          -k "type1_supplier or malformed_identity_h" -vv
      - name: Supplier PDF partial-publication guard
        run: >-
          uv run pytest documents/tests/test_receipt_supplier_pdf_patch.py
          -k "no_partial" -vv
